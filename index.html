<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f2e9" />
    <title>두근두근 자리뽑기</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="두근두근 자리뽑기 홈">
          <span class="brand-mark">✦</span>
          <span>두근두근 자리뽑기</span>
        </a>
        <div class="top-actions">
          <button class="icon-button" id="saveButton" type="button" title="현재 배치 저장">저장</button>
          <button class="icon-button" id="fullscreenButton" type="button" title="전체 화면">전체 화면</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="control-panel" aria-label="자리 배치 설정">
          <div class="panel-heading">
            <p class="eyebrow">SEAT LAB</p>
            <h1>우리 반 자리 만들기</h1>
            <p>책상을 마음대로 옮기고, 번호를 섞어 보세요.</p>
          </div>

          <section class="control-section">
            <div class="section-title-row">
              <h2><span>01</span> 책상 배치</h2>
              <button class="text-button" id="resetLayoutButton" type="button">기본 배치</button>
            </div>
            <div class="stepper-row">
              <div>
                <strong>책상 수</strong>
                <small>최대 36개</small>
              </div>
              <div class="stepper">
                <button id="removeDeskButton" type="button" aria-label="책상 한 개 줄이기">−</button>
                <output id="deskCount">20</output>
                <button id="addDeskButton" type="button" aria-label="책상 한 개 늘리기">＋</button>
              </div>
            </div>
            <div class="selection-tools" id="selectionTools" aria-live="polite">
              <div>
                <strong id="selectedDeskLabel">책상을 선택해 주세요</strong>
                <small>드래그해서 원하는 곳으로 옮길 수 있어요.</small>
              </div>
              <div class="rotate-actions">
                <button id="rotateLeftButton" type="button" aria-label="왼쪽으로 회전">↶</button>
                <button id="rotateRightButton" type="button" aria-label="오른쪽으로 회전">↷</button>
              </div>
            </div>
          </section>

          <section class="control-section">
            <div class="section-title-row">
              <h2><span>02</span> 번호 설정</h2>
              <span class="count-badge" id="numberCount">20명</span>
            </div>
            <label class="input-label" for="numberInput">학생 번호</label>
            <textarea id="numberInput" rows="3" spellcheck="false">1-20</textarea>
            <p class="input-help">예: <button type="button" class="example-button" data-value="1-20">1-20</button> 또는 <button type="button" class="example-button" data-value="1, 3, 5, 7">1, 3, 5, 7</button></p>
            <p class="validation-message" id="validationMessage" aria-live="polite"></p>
          </section>

          <section class="control-section draw-section">
            <div class="section-title-row">
              <h2><span>03</span> 자리뽑기</h2>
            </div>
            <div class="draw-options" role="group" aria-label="자리뽑기 방식">
              <button class="option-chip active" type="button" data-mode="all">한 번에 공개</button>
              <button class="option-chip" type="button" data-mode="one">하나씩 공개</button>
            </div>
            <button class="draw-button" id="drawButton" type="button">
              <span class="draw-icon">✦</span>
              <span>두근두근 자리뽑기</span>
              <span class="draw-arrow">→</span>
            </button>
            <button class="clear-button" id="clearButton" type="button">배정된 번호 지우기</button>
          </section>
        </aside>

        <section class="classroom-area" aria-label="교실 자리 배치">
          <div class="classroom-toolbar">
            <div>
              <p class="class-label">CLASSROOM</p>
              <h2>우리 반 교실</h2>
            </div>
            <div class="status-pill"><span></span><b id="statusText">배치 편집 중</b></div>
          </div>

          <div class="classroom" id="classroom">
            <div class="blackboard">
              <span class="chalk-star">✦</span>
              <div contenteditable="true" spellcheck="false" aria-label="칠판 문구">오늘도 신나는 우리 반!</div>
              <span class="chalk-smile">◡̈</span>
            </div>
            <div class="window-light" aria-hidden="true"></div>
            <div class="plant" aria-hidden="true"><span>●</span><span>●</span><span>●</span><i></i></div>
            <div class="teacher-desk" aria-label="교탁"><span>선생님</span></div>
            <div class="desk-layer" id="deskLayer"></div>
            <div class="empty-hint" id="emptyHint">왼쪽에서 책상을 추가해 주세요</div>
          </div>

          <div class="legend">
            <span><i class="legend-dot drag"></i> 드래그로 이동</span>
            <span><i class="legend-dot select"></i> 클릭해서 선택</span>
            <span><kbd>R</kbd> 선택한 책상 회전</span>
          </div>
        </section>
      </main>
    </div>

    <div class="draw-overlay" id="drawOverlay" aria-hidden="true">
      <div class="sparkles" aria-hidden="true"></div>
      <div class="draw-card">
        <p id="drawKicker">행운의 자리를 찾는 중...</p>
        <div class="lottery-ball" id="lotteryBall">?</div>
        <h2 id="drawTitle">번호들이 교실을 여행하고 있어요!</h2>
        <button id="nextRevealButton" type="button" hidden>다음 자리 공개 <span>→</span></button>
        <button id="closeOverlayButton" type="button" hidden>자리 확인하기 <span>→</span></button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <canvas id="confettiCanvas" aria-hidden="true"></canvas>
    <script src="app.js"></script>
  </body>
</html>
